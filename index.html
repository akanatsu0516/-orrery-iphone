<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>APEX S30 // RP CALCULATOR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<main>
<header>
  <div><span class="eyebrow">APEX LEGENDS / SEASON 30</span><h1>RP CALCULATOR</h1><p>試合結果を入れるだけ。盛れたか、溶けたか、一瞬で判定。</p></div>
  <button id="share" class="ghost">↗ 共有</button>
</header>

<section class="grid">
<article class="panel inputs">
<h2>MATCH DATA</h2>
<label>ランク<select id="rank">
<option value="rookie">ルーキー</option><option value="bronze">ブロンズ</option>
<option value="silver">シルバー</option><option value="gold">ゴールド</option>
<option value="platinum" selected>プラチナ</option><option value="diamond">ダイヤ</option>
<option value="master">マスター</option><option value="pred">プレデター</option>
</select></label>
<label>順位<select id="placement"></select></label>
<div class="two"><label>キル<input id="kills" type="number" min="0" max="30" value="0"></label><label>アシスト<input id="assists" type="number" min="0" max="30" value="0"></label></div>
<div class="two"><label>参加<input id="parts" type="number" min="0" max="30" value="0"><small>チームキル参加</small></label>
<label>TOP5連続<select id="streak"><option value="0">なし / 1回目</option><option value="10">2回目 +10</option><option value="20">3回目 +20</option><option value="30">4回目 +30</option><option value="40">5回目以降 +40</option></select></label></div>
<label class="check"><input id="challenger" type="checkbox"> 自分より上位ティアの敵を倒した（簡易ボーナス）</label>
<button id="calc" class="primary">CALCULATE RP</button>
</article>

<article class="panel result">
<div class="resultTop"><span>RESULT</span><strong id="total">+0 RP</strong></div>
<div id="verdict" class="verdict">試合結果を入力して計算</div>
<div class="breakdown">
<div><span>順位RP</span><b id="placeRP">+0</b></div>
<div><span>撃破RP</span><b id="combatRP">+0</b></div>
<div><span>ボーナス</span><b id="bonusRP">+0</b></div>
<div><span>参加費</span><b id="entryRP">-48</b></div>
</div>
<div class="formula">順位 + 撃破/アシスト/参加 + ボーナス − 参加費</div>
</article>
</section>

<section class="panel quick"><h2>PLACEMENT TABLE</h2><div id="table"></div></section>
<section class="panel history">
<div class="historyHead"><h2>SESSION</h2><button id="reset" class="ghost small">リセット</button></div>
<div class="stats"><div><span>試合数</span><b id="games">0</b></div><div><span>合計RP</span><b id="sum">0</b></div><div><span>平均RP</span><b id="avg">0</b></div><div><span>最大RP</span><b id="best">0</b></div></div>
<div id="log" class="log"><p>まだ試合データはありません。</p></div>
</section>
<footer>Season 30 calculator • ゲーム側のアップデートで計算ルールが変更される場合があります。</footer>
</main>
<script src="app.js"></script>
</body>
</html>
